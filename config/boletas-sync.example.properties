# Copie este archivo a config/boletas-sync.properties y ajuste los valores locales.

boletas.sync.enabled=true
# IMPORTANTE: el generador tambien escribe en esta base (boletas emitidas y
# numeros consumidos por sorteo). Una ruta RELATIVA se resuelve segun el
# directorio desde donde se lanza la aplicacion; si se lanza desde otra parte
# se crea una base vacia y se pierde el control de numeros ya emitidos.
# En produccion use ruta ABSOLUTA, p.ej.:
#   Windows: boletas.sync.sqlite.url=jdbc:sqlite:C:/Boletas/db/boletas.db
#   Linux  : boletas.sync.sqlite.url=jdbc:sqlite:/Boletas/db/boletas.db
boletas.sync.sqlite.url=jdbc:sqlite:db/boletas.db
boletas.sync.ords.url=https://poco.absapex.net/apex/api_boletas/api_boletas/v1/boletas/batch
boletas.sync.timeout.ms=15000
boletas.sync.batch.max=500

# auth.mode: none | basic | bearer
boletas.sync.auth.mode=basic
boletas.sync.auth.user=usuario_ords
boletas.sync.auth.password=clave_ords
boletas.sync.auth.token=

# Reportes habilitados en el combo de generación (IDs separados por coma).
# IDs: 0=12 Boletas Carta H, 1=21 Boletas Carta V, 2=15 Boletas Carta V,
#      3=8 Boletas Vertical 10 oportunidades, 4=8 Boletas Cuadrantes 20 oport.
# Se administra desde la app (gesto secreto: doble clic + Ctrl+Shift sobre
# el campo WhatsApp). Si se omite, se habilitan todos los reportes.
boletas.reportes.habilitados=0,1,2,3,4
